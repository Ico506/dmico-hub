<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMICO</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1614" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DMICO" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260903a" />
</head>
<body>
  <!-- ── Login view ─────────────────────────────────────────── -->
  <main id="login-view" class="login" hidden>
    <div class="login-card">
      <div class="mark">DMICO</div>
      <p class="mark-sub">a quiet place to see your life</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button id="sign-in" class="btn-primary">Sign in</button>
      <p id="login-msg" class="msg" role="status" aria-live="polite"></p>
    </div>
    <p class="login-foot">Private hub · only you can be here</p>
  </main>

  <!-- ── App view ───────────────────────────────────────────── -->
  <div id="app-view" class="app" hidden>
    <aside class="rail">
      <div class="rail-head">
        <div class="mark mark-sm">DMICO</div>
        <div class="rail-tag">life os</div>
      </div>

      <nav id="modules" class="modules" aria-label="Modules"></nav>

      <div class="rail-foot">
        <button id="sign-out" class="btn-ghost">Sign out</button>
      </div>
    </aside>

    <section class="stage">
      <header class="stage-top">
        <h1 id="greeting" class="greeting">Welcome</h1>
        <span id="module-eyebrow" class="eyebrow"></span>
      </header>
      <div id="stage-body" class="stage-body"></div>
    </section>

    <!-- ── Mobile bottom bar (replaces the rail below the tablet breakpoint) ── -->
    <nav id="bottom-bar" class="bottom-bar" aria-label="Modules"></nav>
    <div id="more-sheet" class="more-sheet" hidden>
      <div class="more-sheet-backdrop"></div>
      <div class="more-sheet-panel">
        <div class="more-sheet-grip"></div>
        <div id="more-sheet-list" class="more-sheet-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260903a"></script>
  <script src="research.js?v=20260903a"></script>
  <script src="curators.js?v=20260903a"></script>
  <script src="path.js?v=20260903a"></script>
  <script src="self-study.js?v=20260903a"></script>
  <script src="hygiene.js?v=20260903a"></script>
  <script src="groceries.js?v=20260903a"></script>
  <script src="gamedev.js?v=20260903a"></script>
  <script src="finance.js?v=20260903a"></script>
  <script src="thesis.js?v=20260903a"></script>
  <script src="exercise.js?v=20260903a"></script>
  <script src="entertainment.js?v=20260903a"></script>
  <script src="photos.js?v=20260903a"></script>
  <script src="dashboard.js?v=20260903a"></script>
  <script src="ripple.js?v=20260903a"></script>
  <script src="week.js?v=20260903a"></script>
  <script src="command.js?v=20260903a"></script>
  <script src="life.js?v=20260903a"></script>
  <script src="interactions.js?v=20260903a"></script>
  <script src="now.js?v=20260903a"></script>
  <script src="nudge.js?v=20260903a"></script>
  <script src="push.js?v=20260903a"></script>
  <script src="app.js?v=20260903a"></script>
</body>
</html>
